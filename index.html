    -webkit-background-clip: text;

  @keyframes floatUp {

  /* ── Preloader ── */
  .preloader {

  .preloader.hidden { opacity:0; visibility:hidden; pointer-events:none; }
  .preload-mark {
    font-family:'Syne',sans-serif; font-weight:800; font-size:3rem;
    background:linear-gradient(135deg,#0ea5e9,#6366f1,#10b981);
    background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    animation: gradShift 2s ease infinite, preloadPulse 1.1s ease-in-out infinite;
    letter-spacing:4px;
  }
  @keyframes preloadPulse { 0%,100%{transform:scale(1); opacity:0.85;} 50%{transform:scale(1.08); opacity:1;} }
  .preload-bar-track { width:180px; height:2px; background:rgba(255,255,255,0.08); margin-top:22px; border-radius:2px; overflow:hidden; }
  .preload-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#0ea5e9,#6366f1); animation: preloadFill 1.4s ease forwards; }
  @keyframes preloadFill { to { width:100%; } }

  .app-enter { animation: appFadeIn 0.9s ease both; }
  @keyframes appFadeIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

  .cursor-glow {
    position:fixed; top:0; left:0; width:420px; height:420px; border-radius:50%;
    pointer-events:none; z-index:2; mix-blend-mode:screen;
    background:radial-gradient(circle, rgba(14,165,233,0.10), rgba(99,102,241,0.05) 45%, transparent 70%);
    transform:translate(-50%,-50%); will-change:transform;
  }
  .light .cursor-glow { mix-blend-mode:multiply; background:radial-gradient(circle, rgba(14,165,233,0.08), rgba(99,102,241,0.04) 45%, transparent 70%); }

  /* ── Scroll progress bar ── */

  .reveal { opacity:0; transform:translateY(40px); transition: opacity 0.7s ease, transform 0.7s ease; transition-delay: var(--delay, 0s); }
  .reveal.visible { opacity:1; transform:translateY(0); }
  .reveal-left { opacity:0; transform:translateX(-50px); transition: opacity 0.7s ease, transform 0.7s ease; transition-delay: var(--delay, 0s); }
  .reveal-left.visible { opacity:1; transform:translateX(0); }
  .reveal-right { opacity:0; transform:translateX(50px); transition: opacity 0.7s ease, transform 0.7s ease; transition-delay: var(--delay, 0s); }

  @keyframes glitchBottom { 0%{transform:translate(0,0)} 25%{transform:translate(3px,1px)} 50%{transform:translate(-3px,-1px)} 75%{transform:translate(2px,-1px)} 100%{transform:translate(0,0)} }

  .shine-sweep::before {

  /* ── Animated gradient border ── */
  .grad-border { position:relative; z-index:0; }

    content:''; position:absolute; inset:-1.5px; z-index:-1; border-radius:inherit;

  /* ── Marquee ── */
  .marquee-track { display:flex; gap:2.5rem; width:max-content; animation: marqueeScroll 22s linear infinite; }

  .confetti-piece { position:absolute; top:-10px; border-radius:2px; pointer-events:none; animation: confettiFall linear forwards; }
  @keyframes confettiFall {
    0% { transform:translateY(0) rotate(0deg); opacity:1; }

    position:fixed; bottom:24px; right:24px; z-index:45; width:46px; height:46px; border-radius:50%;

    opacity:0; transform:translateY(16px) scale(0.8); pointer-events:none;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .back-to-top.show { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .back-to-top:hover { transform:translateY(-4px) scale(1.06); }
</style>

function spawnRipple(e) {
  const btn = e.currentTarget;

  const span = document.createElement('span');

  span.style.width = span.style.height = `${size}px`;
  span.style.left = `${e.clientX - rect.left - size/2}px`;
  span.style.top = `${e.clientY - rect.top - size/2}px`;
  btn.appendChild(span);
  setTimeout(() => span.remove(), 650);
}

/* ──────────── CURSOR GLOW ──────────── */
function CursorGlow() {
  const ref = useRef(null);
  useEffect(() => {
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;
    const fn = (e) => {
      if (ref.current) ref.current.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%,-50%)`;
    };
    window.addEventListener('mousemove', fn);
    return () => window.removeEventListener('mousemove', fn);
  }, []);
  return <div ref={ref} className="cursor-glow" />;
}

/* ──────────── SCROLL PROGRESS ──────────── */
function ScrollProgress() {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    const fn = () => {
      const h = document.documentElement;
      const scrolled = h.scrollTop;
      const height = h.scrollHeight - h.clientHeight;
      setPct(height > 0 ? (scrolled / height) * 100 : 0);
    };
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return <div className="scroll-progress" style={{width:`${pct}%`}} />;
}

/* ──────────── MAGNETIC WRAPPER ──────────── */
function Magnetic({ children, strength = 18 }) {
  const ref = useRef(null);
  const onMove = (e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left - r.width/2) / r.width;
    const y = (e.clientY - r.top - r.height/2) / r.height;
    el.style.transform = `translate(${x*strength}px, ${y*strength}px)`;
  };
  const onLeave = () => { if (ref.current) ref.current.style.transform = 'translate(0,0)'; };
  return (
    <div ref={ref} className="magnetic" onMouseMove={onMove} onMouseLeave={onLeave}>
      {children}
    </div>
  );
}

/* ──────────── COUNT UP ──────────── */
function CountUp({ target, suffix = '' }) {
  const ref = useRef(null);
  const [val, setVal] = useState(0);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      obs.disconnect();
      const num = parseInt(target, 10) || 0;
      const dur = 1200;
      const start = performance.now();
      const step = (now) => {
        const p = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        setVal(Math.round(num * eased));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, { threshold: 0.4 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [target]);
  return <span ref={ref}>{val}{suffix}</span>;
}

/* ──────────── TYPING EFFECT ──────────── */
function TypeWriter({ words }) {
  const [display, setDisplay] = useState('');
  const [wordIdx, setWordIdx] = useState(0);
  const [charIdx, setCharIdx] = useState(0);
  const [deleting, setDeleting] = useState(false);

  useEffect(() => {
    const word = words[wordIdx];
    const timeout = deleting
      ? setTimeout(() => {
          setDisplay(p => p.slice(0,-1));
          if (display.length === 1) { setDeleting(false); setWordIdx(i => (i+1)%words.length); }
        }, 60)
      : setTimeout(() => {
          setDisplay(word.slice(0, charIdx+1));
          setCharIdx(i => i+1);
          if (charIdx+1 === word.length) setTimeout(() => setDeleting(true), 1800);
        }, 80);
    return () => clearTimeout(timeout);
  }, [display, charIdx, deleting, wordIdx, words]);

  useEffect(() => { if (!deleting) setCharIdx(0); }, [wordIdx]);

  return <span>{display}<span className="cursor"/></span>;
}

/* ──────────── PROJECTS ──────────── */
function ProjectCard({ p }) {
  const ref = useRef(null);
  const onMove = (e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = `perspective(700px) rotateX(${-y*8}deg) rotateY(${x*8}deg) translateY(-6px)`;
  };
  const onLeave = () => { if (ref.current) ref.current.style.transform = 'perspective(700px) rotateX(0) rotateY(0) translateY(0)'; };

  return (
    <div ref={ref} onMouseMove={onMove} onMouseLeave={onLeave}
      className="proj-card shine-sweep grad-border h-full p-6 rounded-3xl cursor-pointer relative"
      style={{background:'var(--card)', border:'1px solid var(--border)'}}>
      {p.isNew && <span className="new-badge">NEW</span>}
      <div className="proj-card-inner">
        <div className="flex items-start justify-between mb-4">
          <div className="text-4xl">{p.icon}</div>
          <span className="text-xs px-2 py-1 rounded-full font-semibold"
            style={{background:`${p.color}15`, color:p.color}}>
            {p.role}
          </span>
        </div>
        <h3 className="font-black text-base mb-2" style={{color:'var(--text)'}}>{p.name}</h3>
        <p className="text-sm leading-relaxed mb-4" style={{color:'var(--muted)'}}>{p.desc}</p>
        <div className="flex flex-wrap gap-2 mt-auto mb-4">
          {p.tags.map(t => (
            <span key={t} className="text-xs px-2 py-1 rounded-lg font-medium"
              style={{background:'var(--bg3)', color:'var(--muted)'}}>
              {t}
            </span>
          ))}
        </div>
        <div className="flex gap-4">
          <a href={p.link} target="_blank" rel="noreferrer" className="text-xs font-semibold flex items-center gap-1" style={{color:p.color}}>
            GitHub ↗
          </a>
          {p.live && (
            <a href={p.live} target="_blank" rel="noreferrer" className="text-xs font-semibold flex items-center gap-1" style={{color:'#10b981'}}>
              Live Demo ↗
            </a>
          )}
        </div>
      </div>
    </div>
  );
}

/* ──────────── BACK TO TOP ──────────── */
function BackToTop() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const fn = () => setShow(window.scrollY > 600);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return (
    <div className={`back-to-top ${show ? 'show' : ''}`} onClick={() => window.scrollTo({top:0, behavior:'smooth'})}>
      ↑
    </div>
  );
}

/* ──────────── SCROLL REVEAL ──────────── */
function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); }
      });
    }, { threshold: 0.1 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  });
}

/* ──────────── APP ──────────── */
function App() {
  const [dark, setDark] = useState(true);
  const [active, setActive] = useState('Home');
  const [loaded, setLoaded] = useState(false);
  useScrollReveal();

  useEffect(() => {
    const t = setTimeout(() => setLoaded(true), 1400);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    document.body.style.background = dark ? '#0a0a0f' : '#f8fafc';
    document.body.style.color = dark ? '#f1f5f9' : '#0f172a';
  }, [dark]);

  // Active section on scroll
  useEffect(() => {
    const fn = () => {
      NAV_LINKS.forEach(id => {
        const el = document.getElementById(id.toLowerCase());
        if (el) {
          const rect = el.getBoundingClientRect();
          if (rect.top <= 100 && rect.bottom > 100) setActive(id);
        }
      });
    };
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

  return (
    <React.Fragment>
      <Preloader done={loaded} />
      <div className={`${dark ? 'dark' : 'light'} ${loaded ? 'app-enter' : ''}`} style={{background:'var(--bg)', color:'var(--text)', minHeight:'100vh'}}>
        <CursorGlow />
        <ScrollProgress />
        <Particles dark={dark} />
        <Navbar dark={dark} setDark={setDark} active={active} setActive={setActive} />
        <main>
          <Hero dark={dark} />
          <About dark={dark} />
          <Skills dark={dark} />
          <Experience dark={dark} />
          <Projects dark={dark} />
          <Services dark={dark} />
          <Contact dark={dark} />
        </main>
        <Footer dark={dark} />
        <BackToTop />
      </div>
    </React.Fragment>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
